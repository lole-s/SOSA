<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión: Encender la PC — Desafío avanzado</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf4ff;font:17px system-ui,Arial}main{max-width:930px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:clamp(26px,4vw,39px);margin:10px 0}h2{margin-top:12px}.screen{background:#0a1220;border:7px solid #354765;border-radius:18px;padding:26px;min-height:370px}.muted{color:#bbcbdf}.small{font-size:14px}.status{font:13px monospace;color:#8ad9ff}.progress{height:12px;background:#273a53;border-radius:9px;overflow:hidden;margin:20px 0}.bar{height:100%;background:#50c8a3;transition:width .3s}button{border:1px solid #7d9ac3;background:#203b5f;color:#fff;border-radius:10px;padding:12px 16px;margin:5px;cursor:pointer;font:inherit}button:hover{background:#315b87}button:focus-visible{outline:3px solid #ffd16c}.choice{display:block;width:100%;text-align:left}.feedback{border-left:5px solid #f1b75d;background:#28364b;padding:15px;margin:14px 0;border-radius:6px}.good{border-color:#55d2a1}.bios{border:2px solid #a4c4f0;background:#16407a;padding:15px;color:white;font:15px monospace}.bios p{margin:8px 0}.slot{background:#172c45;border:2px dashed #7699c0;border-radius:10px;padding:13px;margin:10px 0}.desk{background:linear-gradient(140deg,#18549a,#188f91);min-height:240px;border-radius:10px;padding:20px}input{padding:10px;background:white;color:#111;border-radius:8px;font:inherit;max-width:100%}.tag{display:inline-block;border:1px solid #6688ae;border-radius:7px;padding:6px 9px;margin:4px}.beep{font:22px monospace;color:#ffd174}details{margin:15px 0}summary{cursor:pointer;color:#a6d9ff}@media(max-width:600px){main{padding:9px}.screen{padding:15px}}
</style></head><body><main><header><div><div class="status">LABORATORIO SOSA · ESCAPE ROOM</div><h1>🖥️ Misión: Encender la PC</h1></div><div id="counter" class="status"></div></header><div class="progress"><div class="bar" id="bar"></div></div><section class="screen" id="screen" aria-live="polite"></section></main>
<script>
const screen=document.getElementById('screen'),counter=document.getElementById('counter'),bar=document.getElementById('bar');
let level=-1,step=0,team='',mistakes=0,order=[],beepCount=0;
const levels=[
{title:'1 · Antes de culpar a Windows',story:'La PC enciende, los ventiladores giran, pero todavía no aparece el logo del sistema operativo.',tasks:[
{q:'¿Qué afirmación es la más razonable?',a:['Como hay energía, Windows necesariamente está dañado.','Puede haber un problema durante la comprobación inicial del hardware (POST).','Si el monitor está negro, significa que el SSD está vacío.'],correct:1,why:'El encendido eléctrico no demuestra que se haya completado la comprobación del hardware.'},
{q:'La PC emite pitidos antes de mostrar una imagen. ¿Qué harías?',a:['Buscar el significado del patrón de pitidos en el manual de ese equipo o placa madre.','Concluir que tres pitidos siempre significan exactamente lo mismo en todas las PC.','Formatear el SSD para silenciar los pitidos.'],correct:0,why:'Los códigos sonoros de POST varían según fabricante, firmware y modelo.'}]},
{title:'2 · Firmware, ROM y pila',story:'Lograste ingresar a la configuración del firmware. Observá la pantalla y discutí las pistas.',tasks:[
{q:'¿Dónde permanece almacenado el firmware BIOS/UEFI cuando apagamos la computadora?',a:['En la RAM, que conserva todo sin energía.','En memoria no volátil de la placa madre (históricamente llamada ROM; hoy suele ser flash).','En la caché del navegador.'],correct:1,why:'El firmware se guarda en memoria no volátil, habitualmente flash; ROM es el nombre tradicional.'},
{q:'Se agotó la pila tipo moneda de una PC antigua. ¿Qué síntoma sería esperable?',a:['El procesador deja de existir.','Se borra automáticamente todo el sistema operativo.','Puede perderse la fecha/hora y algunas configuraciones mantenidas por batería.'],correct:2,why:'La pila RTC/CMOS ayuda a mantener el reloj y, en equipos antiguos, ciertos ajustes. El firmware no se borra.'},
{q:'¿Cuál de estas afirmaciones sobre la pila es correcta?',a:['La pila alimenta Windows mientras usamos la PC.','La pila no es la memoria donde está guardado el firmware.','Quitar la pila borra físicamente la BIOS de todos los equipos.'],correct:1,why:'El firmware permanece en memoria no volátil. El comportamiento de ajustes al retirar la pila depende del equipo.'}]},
{title:'3 · Elegí el dispositivo correcto',story:'La BIOS detecta un SSD con un sistema operativo instalado, un USB vacío y la red. El equipo muestra «No bootable device».',tasks:[
{q:'¿Qué comprobación tiene más sentido hacer primero?',a:['Comprobar si el SSD figura detectado y revisar el orden o entrada de arranque.','Aumentar el brillo del monitor.','Borrar la memoria RAM.'],correct:0,why:'Si el firmware no encuentra un arranque válido, conviene revisar el dispositivo y la configuración de arranque.'},
{q:'Si un USB vacío está primero en la lista, ¿qué se puede concluir?',a:['Siempre impide iniciar, sin excepciones.','El resultado depende de la configuración y de si el firmware continúa con otros dispositivos.','El USB vacío contiene Windows en secreto.'],correct:1,why:'Algunos equipos continúan con el siguiente dispositivo; otros muestran un error. Importa la configuración.'}]},
{title:'4 · Disco, RAM y ejecución',story:'El gestor de arranque encontró el sistema operativo en el SSD. Ahora necesita iniciar su ejecución.',tasks:[
{q:'¿Qué descripción es correcta?',a:['El sistema operativo se almacena en RAM y se ejecuta directamente desde el monitor.','El sistema operativo está almacenado en el SSD y carga componentes necesarios en RAM para ejecutarse.','El sistema operativo está almacenado en la pila CMOS.'],correct:1,why:'Almacenamiento y memoria de trabajo tienen funciones diferentes.'},
{q:'Al apagar normalmente una PC, ¿qué sucede?',a:['La RAM conserva todo para siempre.','El SSD pierde sus archivos y la RAM los conserva.','La RAM pierde su contenido volátil, mientras que los archivos del SSD permanecen.'],correct:2,why:'La RAM habitual es volátil; el SSD usa almacenamiento no volátil.'},
{q:'¿Por qué no basta con tener el sistema operativo guardado en el SSD?',a:['Porque para funcionar deben cargarse en memoria los componentes que se ejecutan.','Porque el SSD solo guarda fotografías.','Porque la BIOS se convierte en el sistema operativo.'],correct:0,why:'Guardar programas no equivale a ejecutarlos: intervienen procesador y memoria RAM.'}]},
{title:'5 · La secuencia final',story:'Ordená las tarjetas de la forma más lógica. Luego podrás iniciar el escritorio.',tasks:[]}
];
const stages=['Se enciende el equipo y comienza la comprobación del hardware','El firmware busca una opción válida de arranque','El gestor de arranque inicia la carga del sistema operativo','Se cargan componentes del sistema operativo en RAM y comienza a funcionar'];
function E(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function B(text,fn,cls=''){const b=E('button',text,cls);b.onclick=fn;return b}
function base(title,story){screen.replaceChildren(E('div','DIAGNÓSTICO / EQUIPO: '+(team||'SIN IDENTIFICAR'),'status'),E('h2',title),E('p',story,'muted'))}
function note(msg,good=false){screen.append(E('div',msg,'feedback'+(good?' good':'')))}
function advance(){level++;step=0;order=[];render()}
function render(){counter.textContent=level<0?'INICIO':level===levels.length?'COMPLETADO':`NIVEL ${level+1}/${levels.length}`;bar.style.width=(Math.max(0,Math.min(level,5))/5*100)+'%';
if(level===-1){base('🚨 ¡La computadora del laboratorio no arranca!','Trabajen en equipos de 3 o 4. Hay cinco niveles, con decisiones técnicas, pistas y una secuencia final. No hace falta saber reparar computadoras: hay que razonar.');const label=E('label','Nombre del equipo: '),input=E('input');input.maxLength=40;input.placeholder='Ej.: Los Bits';screen.append(label,input,E('p','Consejo: discutan antes de responder. No hay límite de intentos.','small muted'),B('Comenzar misión →',()=>{team=input.value.trim()||'Equipo técnico';advance()}));return}
if(level===levels.length){bar.style.width='100%';base('🎉 ¡Arranque completado!','Equipo: '+team);const desk=E('div','','desk');desk.append(E('h2','✓ Escritorio iniciado'),E('p','📁 Archivos    🌐 Navegador    ⚙️ Configuración'));screen.append(desk,E('p','Aprendieron sobre POST, códigos de pitidos, firmware, memoria no volátil, pila CMOS/RTC, dispositivos de arranque y RAM.'),E('p','Respuestas incorrectas durante la misión: '+mistakes,'small muted'),B('Volver a jugar',()=>{level=-1;mistakes=0;render()}));return}
const l=levels[level];base(l.title,l.story);screen.append(E('div',`DESAFÍO ${Math.min(step+1,l.tasks.length||1)} / ${l.tasks.length||1}`,'status'));
if(level===1){const bios=E('div','','bios');['BIOS / UEFI SETUP','Firmware version: 2.12','CPU: detected','RAM: 8192 MB','Storage: SSD detected','Date / Time: 01/01/2018'].forEach(x=>bios.append(E('p',x)));screen.append(bios)}
if(level===0){const d=E('div','BEEP · BEEP · BEEP','slot beep');screen.append(d);screen.append(B('🔊 Escuchar pitidos de ejemplo',()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[0,.34,.68].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=750;g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.09,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.17);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.18)});setTimeout(()=>ctx.close(),1700)}catch(e){}}))}
if(level===4){renderOrder();return}
const task=l.tasks[step];screen.append(E('h3',task.q));task.a.forEach((answer,i)=>screen.append(B(answer,()=>respond(i),'choice')));const details=E('details');details.append(E('summary','Pista opcional'));details.append(E('p',[
['El POST sucede antes de que Windows esté listo.','Los códigos sonoros no son universales.'],
['Pensá qué memoria conserva información sin electricidad.','La pila suele mantener el reloj, no los archivos del disco.','No confundas alimentación del reloj con almacenamiento del firmware.'],
['El mensaje habla de encontrar desde dónde arrancar.','No todos los firmwares se comportan igual.'],
['Distinguí «estar guardado» de «estar funcionando».','Pensá cuál memoria es volátil.','Un programa debe poder ejecutarse, no solo almacenarse.']][level][step],'small muted'));screen.append(details)}
function respond(i){const t=levels[level].tasks[step];screen.querySelectorAll('button').forEach(x=>x.disabled=true);if(i===t.correct){note('✓ '+t.why,true);screen.append(B(step+1<levels[level].tasks.length?'Siguiente desafío →':'Superar nivel →',()=>{if(step+1<levels[level].tasks.length){step++;render()}else advance()}))}else{mistakes++;note('✗ Esa respuesta no resuelve el problema. Discutan por qué y vuelvan a intentarlo.');screen.append(B('Reintentar',render))}}
function renderOrder(){screen.append(E('h3','Secuencia elegida'));screen.append(E('div',order.length?order.map((n,i)=>`${i+1}. ${stages[n]}`).join('  →  '):'Todavía no hay tarjetas.','slot'));screen.append(E('h3','Tarjetas disponibles'));[2,0,3,1].filter(n=>!order.includes(n)).forEach(n=>screen.append(B(stages[n],()=>{order.push(n);renderOrderCheck()},'choice')));screen.append(B('Borrar orden',()=>{order=[];render()}))}
function renderOrderCheck(){if(order.length<4){render();return}render();if(order.every((n,i)=>n===i)){note('✓ Secuencia correcta. ¡Ya pueden iniciar el sistema!',true);screen.append(B('Iniciar escritorio →',advance))}else{mistakes++;note('✗ La secuencia no es correcta. Pista: primero actúa el firmware, después el gestor de arranque.');screen.append(B('Reintentar secuencia',()=>{order=[];render()}))}}
render();
</script></body></html>
